version: '3.8'

services:
  postgres:
    image: postgres
    ports:
      -5432:5432
    environment:
      - POSTGRES_PASSWORD=mysecretpassword
 
  user_app:
    build: 
     network: new-data 
     context: ./
     dockerfile: dockerfile 

    environment:
      -DATABASE_URL="postgresql://postgres:mysecretpassword@joker:5432/postgres"

    ports:
      - 3001:3000
    depends_on:
      - postgres
